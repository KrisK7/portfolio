<div class="group relative overflow-hidden rounded-3xl bg-neutral-100 dark:bg-neutral-800 border border-neutral-200 dark:border-neutral-700">
  <a href="{{ .Get "link" }}" class="no-underline">
    <img src="{{ .Get "image" }}" class="w-full h-64 object-cover transition-transform duration-700 group-hover:scale-105" />
    <div class="p-6">
      <span class="text-xs uppercase tracking-widest text-primary-500 font-bold">{{ .Get "tag" }}</span>
      <h3 class="text-2xl font-bold mt-2">{{ .Get "title" }}</h3>
    </div>
  </a>
</div>
