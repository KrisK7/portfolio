<style>
  .hero-wrapper {
    position: relative;
    width: 100vw;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    margin-top: -65px; /* Adjust based on your menu height */
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #000;
  }

  .hero-img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    margin: 0 !important;
  }

  .hero-mask {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, {{ .Get "opacity" | default "0.4" }});
    z-index: 2;
  }

  .hero-txt {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 0 20px;
  }

  .hero-txt h1 {
    color: white !important;
    font-size: clamp(2rem, 8vw, 4rem) !important;
    text-shadow: 0px 4px 20px rgba(0,0,0,0.6);
    margin: 0 !important;
  }
</style>

<div class="hero-wrapper" style="height: {{ .Get "height" | default "500px" }};">
  <img src="{{ .Get "src" }}" class="hero-img no-lightbox" alt="Hero Image">
  <div class="hero-mask"></div>
  <div class="hero-txt">
    <h1>{{ .Get "title" | default .Page.Title }}</h1>
  </div>
</div>
