<style>
  .hero-container {
    position: relative;
    width: 100vw;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;

    margin-top: -60px;

    height: 500px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-color: #222; /* Fallback */
  }

  .hero-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
    margin: 0 !important;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.4); /* Darkens image so text is readable */
    z-index: 2;
  }

  .hero-content {
    position: relative;
    z-index: 3;
    text-align: center;
    color: white !important;
  }

  .hero-content h1 {
    color: white !important;
    margin: 0;
    font-size: 3rem;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
  }
</style>

<article class="max-w-full prose dark:prose-invert">
  {{ with .Title }}
    <header class="hero-container">
      <img src="/hero7.png" class="hero-image" alt="Hero">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1>{{ . | emojify }}</h1>
      </div>
    </header>
  {{ end }}

  <section class="w-full" style="margin-top: 3rem;">
    {{ .Content }}
  </section>
</article>

<section>
  {{ partial "recent-articles/main.html" . }}
</section>
